# SupplyChain Sentinel Compose Configuration
version: "3.8"

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supplychain-sentinel
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LLM_PROVIDER=nebius
      - NEBIUS_BASE_URL=https://api.tokenfactory.nebius.com/v1/
      - NEBIUS_MODEL=nvidia/Nemotron-3_5-Lightning
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sentinel.db
      - ALLOW_LIVE_SMOKE_TESTS=false
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped

volumes:
  sentinel-data:
