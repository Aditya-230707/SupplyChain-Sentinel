[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplychain-sentinel"
version = "0.1.0"
description = "Evidence-first supplier incident intelligence"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    # Validation / settings
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0,<2.0",
    # HTTP client (provider calls, search)
    "httpx>=0.27.0,<1.0",
    # Retry / resilience
    "tenacity>=8.4.0,<10.0",
    # OpenAI-compatible SDK (Ollama + Nebius both use it)
    "openai>=1.35.0,<2.0",
    # Structured logging
    "structlog>=24.2.0,<25.0",
    # Live public search and content extraction
    "ddgs>=9.16.0",
    "beautifulsoup4>=4.12.0",
    # Date/time utilities
    "python-dateutil>=2.9.0",
    # UUID generation (ULID-style sorting)
    "uuid6>=2024.1.12",
    # Multipart for CSV import
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",        # also needed in dev for test client
    "ruff>=0.5.0",
    "anyio>=4.4.0",         # pytest-asyncio backend
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---- Ruff (lint + format) ----------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "PTH", # pathlib over os.path
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",    # FastAPI Depends() in argument defaults is idiomatic
    "ANN401",  # allow typing.Any for dynamic provider clients
    "S101",    # allow assert in tests
    "S105",    # possible hardcoded password (noisy for placeholders)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]   # relax annotations and security in tests
"scripts/*" = ["ANN", "S", "E501", "E402"]  # relax annotations, line length, and sys.path imports in utility scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- pytest ------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "WARNING"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
